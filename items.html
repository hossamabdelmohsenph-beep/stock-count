<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Items Follow-up</title>
<style>
  :root { --bg:#f4f6fa; --card:#ffffff; --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb; --head:#1e3a8a; --short:#b45309; --over:#1e8a6e; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#0f172a; --card:#1e293b; --ink:#e5e7eb; --muted:#94a3b8; --line:#334155; --head:#1e40af; --short:#fbbf24; --over:#34d399; }
  }
  :root[data-theme="dark"] { --bg:#0f172a; --card:#1e293b; --ink:#e5e7eb; --muted:#94a3b8; --line:#334155; --head:#1e40af; --short:#fbbf24; --over:#34d399; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family: Tahoma, Arial, sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 14px; }
  .top { background: var(--head); color:#fff; border-radius: 14px; padding: 14px 16px; }
  .top h1 { margin:0 0 2px; font-size: 18px; }
  .top small { opacity:.85; }
  .filters { display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin: 12px 0; }
  .filters label { font-size: 12px; color: var(--muted); display:block; margin-bottom:3px; }
  select, input { width:100%; padding:9px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:14px; }
  .kpis { display:grid; grid-template-columns: repeat(2,1fr); gap:8px; }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; text-align:center; }
  .kpi b { display:block; font-size:22px; }
  .kpi span { color:var(--muted); font-size:12px; }
  .sec { font-weight:bold; margin: 16px 0 8px; }
  .item { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px; }
  .item .d { font-size:14px; font-weight:bold; }
  .item .m { font-size:12px; color:var(--muted); margin-top:4px; display:flex; flex-wrap:wrap; gap:8px; }
  .gap { font-weight:bold; }
  .short { color: var(--short); }
  .over { color: var(--over); }
  .empty { text-align:center; color:var(--muted); padding: 24px 0; }
  .foot { text-align:center; color:var(--muted); font-size:12px; margin: 14px 0; }
  .btn { width:100%; padding:10px; border:0; border-radius:10px; background:var(--head); color:#fff; font-size:14px; margin-top:8px; }
  .tbl { width:100%; border-collapse:collapse; font-size:13px; }
  .tbl th, .tbl td { padding:6px 4px; border-bottom:1px solid var(--line); text-align:left; }
  .tbl th { color:var(--muted); font-weight:normal; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Items Follow-up · Al-Mubahij 7811</h1>
    <small id="upd">Loading...</small>
  </div>

  <div style="margin-top:12px"><input type="search" id="fQ" placeholder="Search by item name or code..."></div>

  <div class="filters">
    <div><label>From</label><input type="date" id="fFrom"></div>
    <div><label>To</label><input type="date" id="fTo"></div>
    <div><label>Division</label><select id="fDiv"><option value="">All</option></select></div>
    <div><label>Category</label><select id="fCat"><option value="">All</option></select></div>
    <div><label>Brand</label><select id="fBrand"><option value="">All</option></select></div>
    <div><label>Person</label><select id="fPerson"><option value="">All</option></select></div>
    <div><label>Request</label>
      <select id="fReq">
        <option value="">All</option>
        <option value="no">Not raised</option>
        <option value="yes">Raised</option>
      </select>
    </div>
    <div><label>Difference</label>
      <select id="fType">
        <option value="">All</option>
        <option value="short">Shortage only</option>
        <option value="over">Surplus only</option>
        <option value="same">Matching</option>
      </select>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 8px">
    <button class="btn" id="allDates" style="margin:0">All dates</button>
    <button class="btn" id="exp" style="margin:0;background:#1e8a6e">Export to Excel</button>
  </div>
  <label style="display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:14px"><input type="checkbox" id="fHist" style="width:auto"> Show full history</label>

  <div class="kpis">
    <div class="kpi"><b id="kC">0</b><span>Items counted</span></div>
    <div class="kpi" data-f="short" style="cursor:pointer"><b id="kS" class="short">0</b><span>Shortage (items)</span></div>
    <div class="kpi" data-f="over" style="cursor:pointer"><b id="kO" class="over">0</b><span>Surplus (items)</span></div>
    <div class="kpi"><b id="kN">0</b><span>Net difference (units)</span></div>
    <div class="kpi"><b id="kA">0%</b><span>Count accuracy</span></div>
    <div class="kpi"><b id="kR" class="short">0</b><span>Shortage, no request</span></div>
  </div>

  <div class="sec">Dashboard</div>
  <div class="item"><b style="font-size:13px">By division</b><div id="divTbl" style="margin-top:6px"></div></div>
  <div class="item"><b style="font-size:13px">Daily trend (last 14 days)</b><div id="trend" style="margin-top:6px"></div></div>

  <div class="sec">Details</div>
  <div id="list"></div>
  <button class="btn" id="reload">Refresh</button>
  <div class="foot">Auto-refreshes every minute</div>
</div>

<script>
var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxyQaeVO04fJK0rbNvKe2HXE881wXBBvlZPyWI6xN6Gh4mcDomDzWNUCGtfVw4ruFGD/exec';
var ALL = [];
var REQ = {};
var RQ = {};
var OPEN = {};
var EXPORT = [];
var SEL = ['fDiv', 'fCat', 'fBrand', 'fPerson'];           // cascade order
var KEY = { fDiv: 'div', fCat: 'cat', fBrand: 'brand', fPerson: 'person' };

function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function todayRiyadh() {
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Riyadh', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
}
function inRange(d) {
  var f = $('fFrom').value, t = $('fTo').value, x = String(d).slice(0, 10);
  return (!f || x >= f) && (!t || x <= t);
}

function unique(arr) {
  return arr.filter(function (v, i, a) { return a.indexOf(v) === i; }).sort();
}

// Rows that match the date, the search box and every selection BEFORE this filter
function baseFor(id) {
  var q = $('fQ').value.trim().toLowerCase();
  var before = SEL.slice(0, SEL.indexOf(id));
  return ALL.filter(function (r) {
    if (!inRange(r.date)) return false;
    if (q && (r.item + ' ' + r.code).toLowerCase().indexOf(q) < 0) return false;
    for (var i = 0; i < before.length; i++) {
      var v = $(before[i]).value;
      if (v && r[KEY[before[i]]] !== v) return false;
    }
    return true;
  });
}

// Refill one dropdown from the rows that match the earlier selections
function refill(id) {
  var sel = $(id);
  var cur = sel.value;
  var vals = unique(baseFor(id).map(function (r) { return r[KEY[id]]; }).filter(Boolean));
  var label = sel.options[0].text;
  sel.innerHTML = '<option value="">' + label + '</option>' + vals.map(function (v) {
    return '<option value="' + esc(v) + '">' + esc(v) + '</option>';
  }).join('');
  sel.value = vals.indexOf(cur) >= 0 ? cur : '';
}

function refillAll(fromId) {
  var start = fromId ? SEL.indexOf(fromId) + 1 : 0;
  for (var i = start; i < SEL.length; i++) refill(SEL[i]);
}

// All counts that match the filters (no per-item dedupe), used for the daily trend
function matchRows() {
  var q = $('fQ').value.trim().toLowerCase();
  return ALL.filter(function (r) {
    if (!inRange(r.date)) return false;
    if (q && (r.item + ' ' + r.code).toLowerCase().indexOf(q) < 0) return false;
    for (var i = 0; i < SEL.length; i++) {
      var v = $(SEL[i]).value;
      if (v && r[KEY[SEL[i]]] !== v) return false;
    }
    return true;
  });
}

// Dashboard: accuracy, shortage without request, division table, daily trend
function renderDash(base) {
  var total = base.length;
  var same = base.filter(function (r) { return r.diff === 0; }).length;
  $('kA').textContent = total ? Math.round(same * 100 / total) + '%' : '0%';
  $('kR').textContent = base.filter(function (r) { return r.diff < 0 && !r.raised; }).length;

  // Division table (current count per item)
  var g = {};
  base.forEach(function (r) {
    var k = r.div || '—';
    var o = g[k] || (g[k] = { name: k, counted: 0, short: 0, over: 0 });
    o.counted++;
    if (r.diff < 0) o.short++;
    if (r.diff > 0) o.over++;
  });
  var drows = Object.keys(g).map(function (k) { return g[k]; }).sort(function (a, b) { return b.short - a.short; });
  $('divTbl').innerHTML = drows.length
    ? '<table class="tbl"><tr><th>Division</th><th>Counted</th><th>Short</th><th>Surplus</th></tr>' +
      drows.map(function (o) {
        return '<tr><td>' + esc(o.name) + '</td><td>' + o.counted + '</td><td class="short">' + (o.short || '') + '</td><td class="over">' + (o.over || '') + '</td></tr>';
      }).join('') + '</table>'
    : '<div class="empty">No data</div>';

  // Daily trend: shortage and surplus units per day (all counts, last 14 days)
  var days = {};
  matchRows().forEach(function (r) {
    var d = String(r.date).slice(0, 10);
    var o = days[d] || (days[d] = { short: 0, over: 0 });
    if (r.diff < 0) o.short += -r.diff;
    else if (r.diff > 0) o.over += r.diff;
  });
  var keys = Object.keys(days).sort().slice(-14);
  if (!keys.length) { $('trend').innerHTML = '<div class="empty">No data</div>'; return; }
  var max = 1;
  keys.forEach(function (k) { max = Math.max(max, days[k].short, days[k].over); });
  var W = 640, H = 150, P = 14, slot = (W - 2 * P) / keys.length, bw = Math.max(4, Math.min(14, slot / 3));
  var svg = '<svg viewBox="0 0 ' + W + ' ' + (H + 22) + '" width="100%">';
  keys.forEach(function (k, i) {
    var x = P + i * slot;
    var hs = days[k].short / max * (H - 10), ho = days[k].over / max * (H - 10);
    svg += '<rect x="' + x + '" y="' + (H - hs) + '" width="' + bw + '" height="' + hs + '" fill="#b45309"><title>' + k + ' short ' + days[k].short + '</title></rect>';
    svg += '<rect x="' + (x + bw + 2) + '" y="' + (H - ho) + '" width="' + bw + '" height="' + ho + '" fill="#1e8a6e"><title>' + k + ' surplus ' + days[k].over + '</title></rect>';
    svg += '<text x="' + x + '" y="' + (H + 16) + '" font-size="10" fill="#6b7280">' + k.slice(5) + '</text>';
  });
  svg += '<line x1="' + P + '" x2="' + (W - P) + '" y1="' + H + '" y2="' + H + '" stroke="#e5e7eb"/></svg>';
  $('trend').innerHTML = svg + '<div style="font-size:12px;color:var(--muted)"><span class="short">■ Shortage units</span> &nbsp; <span class="over">■ Surplus units</span></div>';
}

function render() {
  var q = $('fQ').value.trim().toLowerCase();
  var type = $('fType').value;

  // Show each item once (latest count in the period), or every count when history is on
  var hist = $('fHist').checked;
  var latest = {};
  ALL.forEach(function (r) {
    if (!inRange(r.date)) return;
    var cur = latest[r.code];
    if (!cur || String(r.date) > String(cur.date)) latest[r.code] = r;
  });
  var base = (hist ? ALL.filter(function (r) { return inRange(r.date); }) : Object.keys(latest).map(function (k) { return latest[k]; })).filter(function (r) {
    if (!inRange(r.date)) return false;
    if (q && (r.item + ' ' + r.code).toLowerCase().indexOf(q) < 0) return false;
    for (var i = 0; i < SEL.length; i++) {
      var v = $(SEL[i]).value;
      if (v && r[KEY[SEL[i]]] !== v) return false;
    }
    return true;
  });

  var short = 0, over = 0, net = 0;
  base.forEach(function (r) {
    if (r.diff < 0) short++;
    else if (r.diff > 0) over++;
    net += r.diff;
  });
  $('kC').textContent = base.length;
  $('kS').textContent = short;
  $('kO').textContent = over;
  $('kN').textContent = (net > 0 ? '+' : '') + net;
  renderDash(base);

  var reqF = $('fReq').value;
  var list = base.filter(function (r) {
    if (reqF === 'yes' && !r.raised) return false;
    if (reqF === 'no' && r.raised) return false;
    if (type === 'short') return r.diff < 0;
    if (type === 'over') return r.diff > 0;
    if (type === 'same') return r.diff === 0;
    return true;
  });

  EXPORT = list.slice(); // full filtered list for the Excel export
  // Biggest shortage first (Surplus view: biggest surplus first), then newest
  list = list.slice().sort(function (x, y) {
    var d = type === 'over' ? y.diff - x.diff : x.diff - y.diff;
    if (d !== 0) return d;
    return String(y.date) < String(x.date) ? -1 : 1;
  }).slice(0, 200);
  if (!list.length) { $('list').innerHTML = '<div class="empty">No items match this filter</div>'; return; }

  $('list').innerHTML = list.map(function (r) {
    var cls = r.diff < 0 ? 'short' : (r.diff > 0 ? 'over' : '');
    var txt = (r.diff > 0 ? '+' : '') + r.diff;
    var rq = r.rq;
    var open = !!OPEN[r.code];
    var reqLine = '';
    if (rq) {
      var total = 0;
      rq.list.forEach(function (x) { total += x.qty; });
      reqLine = '<div class="m"><span>✅ ' + rq.list.length + (rq.list.length > 1 ? ' requests' : ' request') +
        ' · Total raised: <b>' + total + '</b> units</span><span style="color:var(--head);font-weight:bold">' + (open ? '▲ hide' : '▼ details') + '</span></div>';
    } else if (r.diff < 0) {
      reqLine = '<div class="m"><span>' + (r.raised ? '✅ Request raised' : '⚠ No request yet') + '</span>' +
        '<button data-code="' + esc(r.code) + '" data-on="' + (r.raised ? '0' : '1') + '" style="margin-left:auto;padding:4px 10px;border:0;border-radius:8px;background:#1e3a8a;color:#fff;font-size:12px">' +
        (r.raised ? 'Undo' : 'Mark raised') + '</button></div>';
    }
    var detail = '';
    if (rq && open) {
      detail = '<table style="width:100%;margin-top:8px;border-collapse:collapse;font-size:13px">' +
        '<tr style="color:var(--muted);text-align:left"><th style="padding:4px">Request No.</th><th style="padding:4px">Date</th><th style="padding:4px">Qty</th><th style="padding:4px">Status</th></tr>' +
        rq.list.map(function (x) {
          return '<tr style="border-top:1px solid var(--line)"><td style="padding:4px">' + esc(x.no) + '</td><td style="padding:4px">' + esc(x.date) +
            '</td><td style="padding:4px"><b>' + x.qty + '</b></td><td style="padding:4px">' + esc(x.check) + '</td></tr>';
        }).join('') +
        '</table>';
    }
    return '<div class="item"' + (rq ? ' data-tog="' + esc(r.code) + '" style="cursor:pointer"' : '') + '>' +
      '<div class="d">' + esc(r.item) + '</div>' + reqLine + detail +
      '<div class="m"><span>' + esc(r.code) + '</span><span>' + esc(r.div) + '</span><span>' + esc(r.cat) + '</span><span>' + esc(r.brand) + '</span><span>' + esc(r.person) + '</span></div>' +
      '<div class="m"><span>System: ' + r.sys + '</span><span>Actual: ' + r.actual + '</span>' +
      '<span class="gap ' + cls + '">Diff: ' + txt + '</span><span>' + esc(r.date) + '</span></div>' +
      '</div>';
  }).join('');
}

function load() {
  $('upd').textContent = 'Loading...';
  fetch(SCRIPT_URL + '?format=items', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      REQ = j.req || {};
      RQ = j.rq || {};
      ALL = (j.rows || []).map(function (a) {
        return { date: a[0], person: a[1], code: a[2], item: a[3], sys: a[4], actual: a[5], diff: a[6], div: a[7], cat: a[8], brand: a[9], raised: !!REQ[a[2]] || !!RQ[a[2]], rq: RQ[a[2]] || null };
      });
      refillAll(null);
      $('upd').textContent = 'Last update: ' + new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Riyadh', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date());
      render();
    })
    .catch(function () { $('upd').textContent = 'Could not load, tap Refresh'; });
}

// Changing a dropdown narrows the ones after it, then shows the list
SEL.forEach(function (id) {
  $(id).addEventListener('change', function () { refillAll(id); render(); });
});
['fFrom', 'fTo', 'fType'].forEach(function (id) { $(id).addEventListener('change', function () { refillAll(null); render(); }); });
// Tap Shortage or Surplus to show only those items (tap again to clear)
document.querySelectorAll('.kpi[data-f]').forEach(function (card) {
  card.addEventListener('click', function () {
    var f = card.getAttribute('data-f');
    $('fType').value = $('fType').value === f ? '' : f;
    render();
  });
});
$('fHist').addEventListener('change', render);
$('allDates').addEventListener('click', function () { $('fFrom').value = ''; $('fTo').value = ''; refillAll(null); render(); });
$('fQ').addEventListener('input', function () { refillAll(null); render(); });
$('fReq').addEventListener('change', render);

// Mark a shortage as "request raised" (or undo); saved in the Requests tab
function setRaised(code, on) {
  var item = '';
  ALL.forEach(function (r) { if (r.code === code) { item = r.item; } });
  if (on) { REQ[code] = 'yes'; } else { delete REQ[code]; }
  ALL.forEach(function (r) { if (r.code === code) r.raised = !!on; });
  render();
  fetch(SCRIPT_URL, {
    method: 'POST', mode: 'no-cors', keepalive: true,
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ action: 'request', code: code, item: item, raised: !!on })
  }).catch(function () { alert('Could not save, check your connection'); });
}
document.getElementById('list').addEventListener('click', function (e) {
  var b = e.target.closest('button[data-code]');
  if (b) { setRaised(b.getAttribute('data-code'), b.getAttribute('data-on') === '1'); return; }
  var t = e.target.closest('[data-tog]');
  if (t) { var c = t.getAttribute('data-tog'); OPEN[c] = !OPEN[c]; render(); }
});
$('reload').addEventListener('click', load);

// Export the currently filtered list to a CSV file (opens in Excel, Arabic-safe)
function exportCsv() {
  var head = ['Date', 'Person', 'Code', 'Item', 'Division', 'Category', 'Brand', 'System', 'Actual', 'Diff', 'Requests', 'Total raised'];
  var out = EXPORT.map(function (r) {
    var rq = r.rq ? r.rq.list : [];
    var total = 0;
    rq.forEach(function (x) { total += x.qty; });
    var nos = rq.map(function (x) { return x.no + ' (' + x.date + ', qty ' + x.qty + ')'; }).join(' | ');
    return [r.date, r.person, r.code, r.item, r.div, r.cat, r.brand, r.sys, r.actual, r.diff, nos, rq.length ? total : ''];
  });
  var csv = [head].concat(out).map(function (row) {
    return row.map(function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }).join(',');
  }).join('\r\n');
  var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'items-' + todayRiyadh() + '.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
}
$('exp').addEventListener('click', exportCsv);
load();
setInterval(load, 60000);
</script>
</body>
</html>
